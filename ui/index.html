<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kobold Client</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        document.documentElement.dataset.theme = localStorage.getItem("kobold-theme") || "ember";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
